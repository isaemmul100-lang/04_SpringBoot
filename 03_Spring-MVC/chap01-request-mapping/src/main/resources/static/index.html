<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
</head>
<body>
<h1>Chap01. Spring MVC TEST</h1>
<h2>1. 메소드에 요청 매핑하기</h2>
<h3>GET : /menu/regist</h3>
<button onclick="location.href='menu/regist'">GET 메뉴 등록 요청</button> <!-- 새로운 페이지로 이동 -->
<h3>POST : /menu/regist</h3>
<form action="/menu/regist" method="post">
    <button type="submit">POST 메뉴 등록 요청</button>
</form>

<hr>
<h2>2. 메소드 지정해서 요청 매핑하기</h2>
<h3>GET : /menu/modify</h3>
<button onclick="location.href='menu/modify'">GET 메뉴 수정 요청</button> <!-- 새로운 페이지로 이동 -->
<h3>POST : /menu/modify</h3>
<form action="/menu/modify" method="post">
    <button type="submit">POST 메뉴 수정 요청</button>
</form>

<hr>
<h1>Chap02. class Mapping Test</h1>
<h2>1. 클래스에 요청 매핑하기</h2>
<h3>GET : /order/regist</h3>
<button onclick="location.href='order/regist'">GET 메뉴 등록 요청</button> <!-- onclick : 새로운 페이지로 이동 -->

<h3>POST : /order/modify</h3>
<form action="/order/modify" method="post">
    <button type="submit">POST 주문 수정 요청</button>
</form>

<h3>POST : /order/delete</h3>
<form action="/order/delete" method="post">
    <button type="submit">POST 주문 삭제 요청</button>
</form>

<h3>GET : /order/detail/5</h3>
<button onclick="location.href='order/detail/5'">GET 5번 상세 조회</button>

</body>
</html>
