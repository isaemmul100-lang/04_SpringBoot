spring:
  application:
    name: study-board
  datasource:
    url: jdbc:mysql://localhost:3306/study_board(2)
    username: root
    password: 1234
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: gpt-5-mini
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    # OSIV(Open Session In View)
    # HTTP 응답을 다 만들때까지 영속성 컨텍스트와 DB 커넥션을 유지 (On일경우)
    # 트랜젝션 밖에서 LAZY 필드에 접근하면  LazyInitalizationException이 발생!
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.ai.chat.client.advisor: debug


# 사용자 정의 설정
study-board:
  ai:
    grading-model: gpt-5-nano